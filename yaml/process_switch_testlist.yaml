# Native process-switch self-checks. Sv39 by default; for Sv48 pass
# --cmp_opts '+define+NANHU_V5_1_SV48'. Always execute --iss spike.
- test: nanhu_process_switch_smoke
  description: >
    Reach every injected two-task context-switch scenario, including same-VA
    instruction/data isolation, ASID reuse, scoped SFENCE and permission faults.
  iterations: 1
  gen_test: riscv_instr_base_test
  min_process_switch_hits: 1
  gen_opts: >
    +instr_cnt=10000
    +num_of_sub_program=0
    +boot_mode=m
    +enable_random_boot_mode=0
    +enable_interrupt=0
    +no_csr_instr=1
    +no_ebreak=1
    +no_ecall=1
    +no_dret=1
    +no_wfi=1
    +no_branch_jump=1
    +directed_instr_0=riscv_process_switch_stream,1
    +restrict_store_to_data=1
  gcc_opts: >
    -march=rv64imafdcv_zba_zbb_zbc_zbs_zbkb_zbkc_zbkx_zcb_zicond_zimop_zcmop_zicbom_zicbop_zicboz_zknd_zkne_zknh_zksed_zksh_zvbb_zicsr_zifencei
    -mabi=lp64d

- test: nanhu_process_switch_branch_mix
  description: >
    Mix self-checking process switches with forward random branches and bounded
    ordinary directed streams; Spike must execute at least one complete switch
    injection. Individual skipped injections are reported as skipped.
  iterations: 1
  gen_test: riscv_instr_base_test
  min_process_switch_hits: 1
  gen_opts: >
    +instr_cnt=10000
    +num_of_sub_program=0
    +boot_mode=m
    +enable_random_boot_mode=0
    +enable_interrupt=0
    +enable_floating_point=1
    +no_csr_instr=1
    +no_ebreak=1
    +no_ecall=1
    +no_dret=1
    +no_wfi=1
    +no_branch_jump=0
    +directed_instr_0=riscv_process_switch_stream,2
    +directed_instr_1=riscv_int_numeric_corner_stream,4
    +directed_instr_2=riscv_load_store_rand_instr_stream,4
    +restrict_store_to_data=1
  gcc_opts: >
    -march=rv64imafdcv_zba_zbb_zbc_zbs_zbkb_zbkc_zbkx_zcb_zicond_zimop_zcmop_zicbom_zicbop_zicboz_zknd_zkne_zknh_zksed_zksh_zvbb_zicsr_zifencei
    -mabi=lp64d

- test: nanhu_process_switch_disabled
  description: Omit the process-switch directed entry while preserving ordinary random generation.
  iterations: 1
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=200
    +num_of_sub_program=0
    +boot_mode=m
    +no_csr_instr=1
    +no_ebreak=1
    +no_ecall=1
    +no_dret=1
    +no_wfi=1
    +restrict_store_to_data=1
  gcc_opts: >
    -march=rv64imafdcv_zba_zbb_zbc_zbs_zbkb_zbkc_zbkx_zcb_zicond_zimop_zcmop_zicbom_zicbop_zicboz_zknd_zkne_zknh_zksed_zksh_zvbb_zicsr_zifencei
    -mabi=lp64d
