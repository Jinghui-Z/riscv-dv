    -mabi=lp64d
    -mno-strict-align

# Base B/J instructions do not depend on any CFI extension. Forward branches
# can skip an atomic Hypertest stream, so this entry requires at least one
# executed injection per ELF and records any others as skipped in the Spike
# validation JSON. Use the entry above when every injection must be reached.
- test: nanhu_big_random_hypertest_branch_mix
  description: >
    Approximately 10k base instructions with ordinary random branches,
    bounded loop/JAL directed streams and random source Hypertest injections.
    Fixed M boot, Sv48, full RV64 floating-point/vector bridge state and at
    least one executed Hypertest injection are required.
  iterations: 1
  min_hypertest_hits: 1
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=10000
    +num_of_sub_program=0
    +boot_mode=m
    +enable_floating_point=1
    +no_csr_instr=1
    +no_ebreak=1
    +no_ecall=1
    +no_dret=1
    +no_wfi=1
    +no_branch_jump=0
    +enable_random_directed_instr=1
    +random_directed_instr_ratio=4
    +enable_random_hypertest=1
    +random_hypertest_ratio=3
    +hypertest_case_file=src/hypertest/case_names_random_cosim_on.txt
    +restrict_generated_store_to_data=1
    +restrict_store_to_data=0
  gcc_opts: >
    -march=rv64imafdcv_zba_zbb_zbc_zbs_zbkb_zbkc_zbkx_zcb_zicond_zimop_zcmop_zicbom_zicbop_zicboz_zknd_zkne_zknh_zksed_zksh_zvbb_zicsr_zifencei
    -mabi=lp64d
    -mno-strict-align

# Source Hypertest cases may intentionally modify code. This separate, disabled
# reference only restricts DV-generated stores; it does not certify the full
# cosim-on pool for NanHu, standalone Spike, repeated mixing or RTL cosim.
# Copy the entry and set iterations > 0 only after selecting/reviewing suitable
# source cases and their ISA/platform/bridge dependencies.
- test: nanhu_big_random_hypertest_cosim_on_scoped_reference
  description: >
    Reference configuration for drawing from the full cosim-on superset while
    restricting DV-generated stores. Source Hypertest writes retain their
    original behavior, including intentional self-modifying code.
  iterations: 0
  min_hypertest_hits: 1
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=10000
    +num_of_sub_program=0
    +boot_mode=m
    +enable_floating_point=1
    +no_csr_instr=1
    +no_ebreak=1
    +no_ecall=1
    +no_dret=1
    +no_wfi=1
    +no_branch_jump=0
    +enable_random_directed_instr=1
    +random_directed_instr_ratio=4
    +enable_random_hypertest=1
    +random_hypertest_ratio=3
    +hypertest_case_file=src/hypertest/case_names_random_cosim_on.txt
    +restrict_generated_store_to_data=1
    +restrict_store_to_data=0
  gcc_opts: >
    -march=rv64imafdcv_zba_zbb_zbc_zbs_zbkb_zbkc_zbkx_zcb_zicond_zimop_zcmop_zicbom_zicbop_zicboz_zknd_zkne_zknh_zksed_zksh_zvbb_zicsr_zifencei
    -mabi=lp64d

# Do not run this entry with --target nanhu_v5_1. To use it, first create
# and validate a separate RV64 Sv39 target with support_pmp=1, then change
# iterations to a positive value in a copy of this file. --iterations cannot
# revive an entry whose YAML iterations is zero.
- test: rv64_pmp_big_random_reference
  description: >
    PMP-capable target only: random directed streams and one randomly chosen
    load/store PMP permission fault, with S-mode boot and M-mode recovery.
  iterations: 0
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=10000
    +num_of_sub_program=2
    +boot_mode=s
    +no_delegation=1
    +enable_floating_point=1
    +enable_random_directed_instr=1
    +random_directed_instr_ratio=4
    +enable_random_pmp_exception=1
    +restrict_store_to_data=1
  gcc_opts: >
    -march=rv64imafdc_zicsr_zifencei
    -mabi=lp64d
