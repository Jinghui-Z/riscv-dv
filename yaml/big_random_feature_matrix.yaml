# below, but most of its source cases lack integrated Spike evidence.
- test: nanhu_big_random_hypertest_branch_mix_reviewed
  description: >
    Approximately 10k base instructions with ordinary random branches,
    bounded directed streams and random Hypertest injections selected from
    the reviewed six-case pool. Fixed M boot and Sv48 are required.
  iterations: 1
  min_hypertest_hits: 1
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=1500
    +num_of_sub_program=0
    +boot_mode=m
    +enable_floating_point=1
    +no_csr_instr=1
    +no_ebreak=1
    +no_ecall=1
    +no_dret=1
    +no_wfi=1
    +no_branch_jump=0
    +enable_random_directed_instr=1
    +random_directed_instr_ratio=4
    +enable_random_hypertest=1
    +random_hypertest_ratio=3
    +hypertest_case_file=src/hypertest/case_names_random.txt
    +restrict_generated_store_to_data=1
    +restrict_store_to_data=0
  gcc_opts: >
