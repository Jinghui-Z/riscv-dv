    -mabi=lp64d
  rtl_test: core_base_test

# Re-run the preceding MMU test with
# --cmp_opts="+define+NANHU_V5_1_SV48" to select the Sv48 target variant.
- test: nanhu_v5_1_csr_smoke
  description: >
    Random accesses across the implemented base, state-enable, timer,
    counter-overflow, trigger, floating-point and vector CSR whitelist. Debug
    CSRs are covered separately by the Debug ROM smoke test. Spike does not
    model the NanHu trigger/context CSRs TCONTROL (0x7a5), MCONTEXT (0x7a8),
    MSCONTEXT (0x7aa) and SCONTEXT (0x5a8), so an illegal trap is expected for
    those accesses; Spike still executes the ELF.
  iterations: 1
  allow_iss_illegal_instr: 1
  iss_allowed_illegal_csrs:
    - 0x7a5
    - 0x7a8
    - 0x7aa
    - 0x5a8
  iss_illegal_reason: >
    The selected Spike build lacks NanHu TCONTROL/MCONTEXT/MSCONTEXT/SCONTEXT
    CSR models; allow only those CSR illegal traps, not other instructions.
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=3000
    +num_of_sub_program=0
    +boot_mode=m
    +enable_floating_point=1
    +enable_vector_extension=1
    +use_vector_1_0=1
    +gen_all_csrs_by_default=1
    +gen_csr_ro_write=0
    +add_csr_write=MENVCFG,MSTATEEN0,MSTATEEN1,MSTATEEN2,MSTATEEN3,MCOUNTEREN,MCOUNTINHIBIT,MHPMEVENT3,TSELECT,TDATA1,TDATA2,TDATA3,TCONTROL,MCONTEXT,MSCONTEXT,SENVCFG,SSTATEEN0,STIMECMP,SCONTEXT,VXSAT,VXRM,VCSR
  gcc_opts: >
    -march=rv64imafdcv_zicsr_zifencei
    -mabi=lp64d
  rtl_test: core_base_test

- test: nanhu_v5_1_invalid_csr_smode_smoke
  description: >
    Supervisor-mode invalid-level CSR accesses, including M-mode trigger CSRs
    whose names do not begin with an M prefix. Intentional accesses to trigger
    CSR addresses TSELECT through TCONTROL (0x7a0-0x7a5) are expected to trap
    as illegal while Spike still executes the ELF.
  iterations: 1
  allow_iss_illegal_instr: 1
  iss_allowed_illegal_csrs:
    - 0x7a0
    - 0x7a1
    - 0x7a2
    - 0x7a3
    - 0x7a4
    - 0x7a5
  iss_illegal_reason: >
    This entry intentionally accesses M-mode trigger CSRs 0x7a0-0x7a5 from
    S-mode; allow only the expected illegal traps for those CSR instructions.
  gen_test: riscv_invalid_priv_csr_filter_test
  gen_opts: >
    +instr_cnt=1500
    +num_of_sub_program=0
    +boot_mode=s
    +enable_access_invalid_csr_level=1
    +dist_control_mode=1
    +dist_csr=1000
    +no_ebreak=1
    +no_ecall=1
  gcc_opts: >
    -march=rv64imafdc_zicsr_zifencei
    -mabi=lp64d
  rtl_test: core_base_test

