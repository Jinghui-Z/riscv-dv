- test: nanhu_v5_1_stval_delegation_smoke
  description: >
    U-mode exception delegation into the S-mode trap handler with STVAL
    reported through the configured signature channel.
  iterations: 1
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=1000
    +num_of_sub_program=0
    +boot_mode=u
    +no_delegation=0
    +force_m_delegation=1
    +set_mstatus_sum=1
    +enable_tval_check=1
    +require_signature_addr=1
    +signature_addr=8fffffd0
