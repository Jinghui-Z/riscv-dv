- test: nanhu_v5_1_zbkc_subset_smoke
  description: >
    Strict Zbkc subset regression. Compiling with Zbkc but without Zbc makes
    any accidental CLMULR generation fail in the assembler stage.
  iterations: 1
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=2500
    +num_of_sub_program=0
    +boot_mode=m
    +march=RV64I,RV64ZBKC
    +enable_zbkc_extension=1
    +no_csr_instr=1
  gcc_opts: >
    -march=rv64i_zbkc_zicsr_zifencei
    -mabi=lp64
  rtl_test: core_base_test

# Encoding and alternate-group unit regression. Keep it out of the default
# smoke set. The runner filters zero-iteration entries before applying the CLI
# override, so enable this in a copied testlist and run it with --steps gen.
- test: nanhu_v5_1_scalar_encoding_unit
  iterations: 0
  no_iss: 1
  gen_test: riscv_scalar_ext_encoding_test
  gen_opts: >
    +num_of_tests=1

- test: nanhu_v5_1_svinval_svpbmt_smoke
  description: >
    Supervisor translation, fine-grained invalidation and PBMT page-table smoke
    test. Sv39 is used unless the generator is compiled for the Sv48 variant.
    The signature address below is generator-only scratch space; a real SoC/TB
    run must override it with a writable address from the integration map.
  iterations: 1
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=2500
    +num_of_sub_program=0
    +boot_mode=s
    +enable_page_table_exception=1
    +svade_fault_mode=1
    +enable_tval_check=1
    +require_signature_addr=1
    +signature_addr=8ffffff0
    +enable_svinval_extension=1
    +enable_svpbmt=1
  gcc_opts: >
    -march=rv64imafdc_svinval_svpbmt_zicsr_zifencei
    -mabi=lp64d
  rtl_test: core_base_test

