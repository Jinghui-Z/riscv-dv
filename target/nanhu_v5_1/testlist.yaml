- test: nanhu_v5_1_base_smoke
  description: >
    RV64 IMAFDC base, privilege, floating-point and unaligned-access smoke test.
  iterations: 1
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=3000
    +num_of_sub_program=2
    +enable_floating_point=1
    +enable_unaligned_load_store=1
  gcc_opts: >
    -march=rv64imafdc_zicsr_zifencei
    -mabi=lp64d
    -mno-strict-align
  rtl_test: core_base_test

- test: nanhu_v5_1_scalar_extensions_smoke
  description: >
    Ratified scalar bit-manipulation, compressed, conditional, MOP and
    cache-block operation extensions supported by NanHu V5.1.
  iterations: 1
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=4000
    +num_of_sub_program=1
    +boot_mode=m
    +enable_zba_extension=1
    +enable_zbb_extension=1
    +enable_zbc_extension=1
    +enable_zbkc_extension=1
    +enable_zbs_extension=1
    +enable_zcb_extension=1
    +enable_zicond_extension=1
    +enable_zimop_extension=1
    +enable_zcmop_extension=1
    +enable_zicbom_extension=1
    +enable_zicbop_extension=1
    +enable_zicboz_extension=1
    +directed_instr_0=riscv_cbo_instr_stream,1
  gcc_opts: >
    -march=rv64imafdc_zba_zbb_zbc_zbs_zcb_zicond_zimop_zcmop_zicbom_zicbop_zicboz_zicsr_zifencei
    -mabi=lp64d
  rtl_test: core_base_test

